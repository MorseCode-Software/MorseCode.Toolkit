# Builds the DocFX site under docs/ and publishes it to GitHub Pages.
#
# This is independent of build.yml, which builds, tests, packs and releases the .NET solution. The
# two do not share state: that one owns NuGet releases, this owns the documentation site. It follows
# SodaFlow's docs.yml.
#
# Publishing needs GitHub Pages enabled for the repository, with the source set to "GitHub Actions"
# (Settings > Pages). Until then the deploy job fails; the build job, which pull requests run, does
# not depend on it.
name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs.yml'
  # Pull requests have no path filter, so that the check of the build job can be required. GitHub waits
  # for a required check of a workflow that a path filter skips, and the pull request never merges.
  # samples.yml has no filter for the same cause. A push to main keeps its filter: only a change to the
  # site needs a deploy.
  pull_request:
  workflow_dispatch:

# The deploy job adds the two permissions that GitHub Pages needs. The build job, which each pull request
# runs, gets only this.
permissions:
  contents: read

# A group for each ref, so that a run of a pull request cannot cancel a run of main. GitHub cancels a run
# that waits in a group when a newer run comes into that group. With one group for each run, a pull
# request cancelled the deploy of main that waited. A newer push to a pull request cancels its older run.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name is the status check name, which the ruleset requires. A rename needs a matching ruleset
  # change.
  build:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # 10.0 to build the projects DocFX extracts, which need its C# 14 compiler, and 8.0 to
          # run DocFX itself, which is built for net8.0.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      # Only the projects DocFX extracts: the ones that the metadata entry of docfx.json lists. The
      # test projects are not part of the site. A restore of the Avalonia controls restores the
      # others with it, through the project references, but each one is named here so that the list
      # matches docfx.json without knowledge of the references.
      - name: Restore projects
        run: |
          dotnet restore src/MorseCode.StagedConstruction/MorseCode.StagedConstruction.csproj
          dotnet restore src/MorseCode.Mvvm/MorseCode.Mvvm.csproj
          dotnet restore src/MorseCode.Controls.ViewModels/MorseCode.Controls.ViewModels.csproj
          dotnet restore src/MorseCode.Controls.UI.Avalonia/MorseCode.Controls.UI.Avalonia.csproj

      # Directory.Build.props gives every library two analyzers, MorseCode.Analyzers and the analyzer
      # of MorseCode.StagedConstruction. DocFX loads the libraries without a build, thus it needs the
      # analyzers already built. Without one, DocFX reports FailedToResolveAnalyzer, which
      # --warningsAsErrors fails. A build of the second builds the first, which it has as an analyzer,
      # but each is named here so that the list matches Directory.Build.props.
      - name: Build analyzers
        run: |
          dotnet build src/MorseCode.Analyzers/MorseCode.Analyzers.csproj --configuration Release -warnaserror
          dotnet build src/MorseCode.StagedConstruction.Analyzers/MorseCode.StagedConstruction.Analyzers.csproj --configuration Release -warnaserror

      - name: Build site
        run: dotnet docfx docs/docfx.json --warningsAsErrors

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  # Pull requests build the site to catch breakage, but only main publishes it.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Never let two publishes race. In-progress runs are allowed to finish so a deploy is not left
    # half-applied.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
